# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  pull_request:
    branches: [mainline]
  push:
    branches: [mainline]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The macOS-only checks (packaging, signing, the sandboxed build) run with
  # `npm run ci` on a Mac; this job runs everything that works on Linux.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs. Lift the restriction for this job's runner only, so the
      # end-to-end tests run with the sandbox on.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: npm run ci:linux
        run: xvfb-run --auto-servernum npm run ci:linux
      # A failed run keeps one thing: how each test's close waited for the
      # app's core process (fixed words and numbers only).
      - name: Keep the close-wait record of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: close-waits
          path: test-output/close-waits.jsonl
          if-no-files-found: ignore
          retention-days: 7
