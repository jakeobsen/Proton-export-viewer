# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  pull_request:
    branches: [mainline]
  push:
    branches: [mainline]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The macOS-only checks (packaging, signing, the sandboxed build) run with
  # `npm run ci` on a Mac; this job runs everything that works on Linux.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs. Lift the restriction for this job's runner only, so the
      # end-to-end tests run with the sandbox on.
      - name: Allow user namespaces for the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # ci:linux runs ShellCheck on the shell scripts.
      - name: Install ShellCheck
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck)
      - name: npm run ci:linux
        run: xvfb-run --auto-servernum npm run ci:linux
